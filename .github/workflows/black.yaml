name: Black

# Disabled on push/pull_request in this fork: fork PR CI has no access to
# repository secrets, so this generic check just adds noise. Cloud-agents
# work is scoped to cloud_agents_tests.yaml instead. Trigger manually via
# workflow_dispatch if needed.
on:
  workflow_dispatch:

jobs:
  black:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Black check
        run: uv tool run black --check src tests
