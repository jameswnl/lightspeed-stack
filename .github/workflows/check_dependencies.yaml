name: Check dependencies

# Disabled on push/pull_request in this fork: not related to cloud-agents
# work. Trigger manually via workflow_dispatch if needed.
on:
  workflow_dispatch:

jobs:
  check_dependencies:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync
      - name: List dependencies
        run: uv pip list
