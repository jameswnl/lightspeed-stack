name: Pyright

# Disabled on push/pull_request in this fork: not related to cloud-agents
# work. Trigger manually via workflow_dispatch if needed.
on:
  workflow_dispatch:

jobs:
  pyright:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    name: "Pyright"
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --group llslibdev
      - name: Run Pyright tests
        run: uv run pyright src
