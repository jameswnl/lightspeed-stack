name: Radon

# Disabled on push/pull_request in this fork: not related to cloud-agents
# work. Trigger manually via workflow_dispatch if needed.
on:
  workflow_dispatch:

jobs:
  radon:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    name: "radon"
    steps:
      - uses: actions/checkout@v7
      - uses: davidslusser/actions_python_radon@v1.0.0
        with:
          src: "src"
          min: "A"
          grade: "B"
