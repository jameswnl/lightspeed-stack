name: Shell check

# Disabled on push/pull_request in this fork: not related to cloud-agents
# work. Trigger manually via workflow_dispatch if needed.
on:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
      - name: Shell check
        run: make shellcheck
