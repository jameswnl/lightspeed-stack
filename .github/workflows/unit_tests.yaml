name: Unit tests

# Disabled on push/pull_request in this fork: this fork's harness branch is
# scoped to cloud-agents integration work, and cloud_agents_tests.yaml
# already covers the cloud-agents-specific unit/integration/e2e-mock subset
# on every push/PR to harness. Auto-running the full upstream LCS unit-test
# matrix (2 Python versions, the whole tests/unit tree) on every PR here
# adds CI time without extra signal for this fork's scope. Trigger manually
# via workflow_dispatch (e.g. to vet a dependency bump against the full
# suite) -- `uv run make test-unit` locally is equivalent.
on:
  workflow_dispatch:

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python version
        run: uv run python --version
      - name: uv version
        run: uv --version
      - name: Install dependencies
        run: uv pip install --python ${{ matrix.python-version }} --group llslibdev .
      - name: Install pdm  # Required for dynamic version test
        run: uv pip install pdm
      - name: Run unit tests
        run: uv run pytest tests/unit --cov=src --cov=runner --cov-report term-missing
