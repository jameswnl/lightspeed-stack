name: Unit tests

# Disabled on push/pull_request in this fork: fails with ModuleNotFoundError
# for cloud_agents in fork PR CI prior to the pyproject.toml dependency fix.
# Cloud-agents-related unit tests now run via cloud_agents_tests.yaml, which
# is properly branch/secret-scoped. Trigger manually via workflow_dispatch
# if needed.
on:
  workflow_dispatch:

jobs:
  unit_tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Python version
        run: uv run python --version
      - name: uv version
        run: uv --version
      - name: Install dependencies
        run: uv pip install --python ${{ matrix.python-version }} --group llslibdev .
      - name: Install pdm  # Required for dynamic version test
        run: uv pip install pdm
      - name: Run unit tests
        run: uv run pytest tests/unit --cov=src --cov=runner --cov-report term-missing
