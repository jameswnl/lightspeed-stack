services:
  postgres:
    image: postgres:16
    container_name: lightspeed-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: lightspeed
      POSTGRES_PASSWORD: lightspeed
      POSTGRES_DB: lightspeed
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - lightspeednet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lightspeed"]
      interval: 5s
      timeout: 3s
      retries: 5

  jaeger:
    image: jaegertracing/all-in-one:1.64
    container_name: lightspeed-jaeger
    ports:
      - "4317:4317"
      - "16686:16686"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    networks:
      - lightspeednet

volumes:
  pgdata:

networks:
  lightspeednet:
    driver: bridge
