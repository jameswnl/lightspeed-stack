# =============================================================================
# BOOTSTRAP / DEV ONLY. Production syncs these Secrets from the secret
# manager with external-secrets.yaml; never commit real values.
# K8s Secret manifests for the workflows example (namespace: lightspeed).
# Replace every CHANGEME value before applying. These are the ONLY place
# where secret values exist: lightspeed-stack.yaml references them by name,
# and workflow definitions / API requests never mention them at all.
#
#   kubectl apply -n lightspeed -f k8s-secrets.yaml
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: lightspeed-inference-creds
  namespace: lightspeed
type: Opaque
stringData:
  # Bound to inference/anthropic-prod and inference/openai-team-b (backend: env).
  # Mounted into the stack Deployment as ANTHROPIC_API_KEY / OPENAI_TEAM_B_KEY.
  ANTHROPIC_API_KEY: CHANGEME-anthropic-key
  OPENAI_TEAM_B_KEY: CHANGEME-openai-key
  AZURE_OPENAI_API_KEY: CHANGEME-azure-key
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-github-readonly-token
  namespace: lightspeed
type: Opaque
stringData:
  # Bound to mcp/github-readonly (backend: k8s, key: token).
  # Mounted into ephemeral sandboxes as the Authorization header for github-readonly.
  token: "Bearer CHANGEME-github-pat"  # full header value, see README
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-kb-search-token
  namespace: lightspeed
type: Opaque
stringData:
  # Bound to mcp/kb-search (backend: k8s, key: api-key).
  api-key: CHANGEME-kb-api-key
---
apiVersion: v1
kind: Secret
metadata:
  name: mcp-incidents-token
  namespace: lightspeed
type: Opaque
stringData:
  # Bound to mcp/incidents (backend: k8s, key: token); admin inline MCP only.
  token: "Bearer CHANGEME-incidents-token"
---
apiVersion: v1
kind: Secret
metadata:
  name: openshell-gateway-tls
  namespace: lightspeed
type: kubernetes.io/tls
data:
  # mTLS client identity for stack -> OpenShell gateway. Fill with base64.
  ca.crt: CHANGEME-base64-gateway-ca
  tls.crt: CHANGEME-base64-client-cert
  tls.key: CHANGEME-base64-client-key
---
apiVersion: v1
kind: Secret
metadata:
  name: lightspeed-postgres
  namespace: lightspeed
type: Opaque
stringData:
  # Injected as POSTGRES_PASSWORD for database.postgres.password (${env.POSTGRES_PASSWORD}).
  password: CHANGEME-postgres-password
---
apiVersion: v1
kind: Secret
metadata:
  name: lightspeed-postgres-tls
  namespace: lightspeed
type: Opaque
stringData:
  ca.crt: CHANGEME-postgres-ca-pem
