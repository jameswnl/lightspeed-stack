name: Lightspeed Core Stack (Harness)
service:
  host: 0.0.0.0
  port: 8090
  base_url: http://localhost:8090
  auth_enabled: false
  workers: 1
  color_log: true
  access_log: true

llama_stack:
  use_as_library_client: false
  url: http://localhost:8321
  allow_degraded_mode: true
  # cloud-agents doesn't use Llama Stack at all -- pydantic-ai talks to
  # OpenAI directly -- so fail fast into degraded mode instead of the
  # default 5 retries x 2s (~10s+ of pure startup wait for a dependency
  # this harness config's actual workload never touches). No retry_delay
  # override needed: with max_retries=1 the check never sleeps between
  # attempts (there's only one).
  max_retries: 1

user_data_collection:
  feedback_enabled: false

database:
  postgres:
    host: localhost
    port: 5432
    db: lightspeed
    user: lightspeed
    password: lightspeed

conversation_cache:
  type: "postgres"
  postgres:
    host: localhost
    port: 5432
    db: lightspeed
    user: lightspeed
    password: lightspeed

authentication:
  module: "noop"

workflow_engine:
  enabled: true
  max_concurrent_workflows: 10
  transcript_retention_days: 30

spawner:
  type: openshell
  openshell_gateway_url: "${env.OPENSHELL_GATEWAY_URL:=localhost:17670}"
  sandbox_image: "${env.LIGHTSPEED_SANDBOX_IMAGE:=quay.io/jameswong/lightspeed-agentic-sandbox:latest}"
  # --- Real OCP-prod gateway (confidential lcore-agents OIDC client) ---
  # Left off by default: the local Kind/Podman gateway needs no TLS and no
  # auth. To target the OCP-prod gateway, source that run's .env.ocp-prod
  # (see ~/ws/local-infra: make ocp-prod-keycloak-lcore-client) and uncomment
  # the block below. OPENSHELL_GATEWAY_URL from that file already carries the
  # :443 gRPC port. The TLS CA is the gateway's self-signed cert (certifi
  # can't verify it); set OPENSHELL_TLS_CA to e.g.
  # ~/.config/openshell/gateways/ocp-prod/ca.crt. For OCP set
  # LIGHTSPEED_SANDBOX_IMAGE to an amd64 image the cluster can pull.
  # openshell_tls_ca: "${env.OPENSHELL_TLS_CA}"
  # openshell_oidc_issuer: "${env.OPENSHELL_OIDC_ISSUER}"
  # openshell_oidc_client_id: "${env.OPENSHELL_OIDC_CLIENT_ID}"
  # openshell_oidc_client_secret: "${env.OPENSHELL_OIDC_CLIENT_SECRET}"
  # openshell_oidc_audience: "${env.OPENSHELL_OIDC_AUDIENCE}"
